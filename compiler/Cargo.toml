[package]
name = "compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

jocky-ast = { path = "../../M2/compiler/ast" }
jocky-lexer = { path = "../../M2/compiler/lexer" }
jocky-parser = { path = "../../M2/compiler/parser" }
