[package]
name = "agent"
version = "0.1.0"
edition = "2021"
authors = ["Jocky Team"]
description = "Lightweight endpoint telemetry and security evidence collector agent"

[dependencies]
# Async Runtime & Logging
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

# Serialization & Data Modeling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# Evidence Integrity & Error Handling
sha2 = "0.10"
thiserror = "1.0"
anyhow = "1.0"

reqwest = { version = "0.12", features = ["json"] }

# Optional: keep only if your Collector trait requires async fn
async-trait = "0.1"

# Authoritative Compiler & IR Crate
compiler = { path = "../compiler" }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }